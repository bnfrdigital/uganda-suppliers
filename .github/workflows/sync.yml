name: Sync Notion
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python sync.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
      - run: |
          git config user.name "notion-sync"
          git config user.email "notion-sync@users.noreply.github.com"
          git add ideas.md
          git diff --staged --quiet || git commit -m "Update from Notion"
          git push
